set -g prefix C-a
unbind C-b

set-option -g default-terminal "tmux-256color"
set -g mouse on
setw -g mode-keys vi
bind Enter copy-mode
set -g history-limit 50000 

set -g status-style 'bg=colour233 fg=colour99'
set-option -g pane-active-border-style fg=colour99

bind -T copy-mode-vi v send -X begin-selection

if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi C-c send -X copy-pipe-no-clear 'pbcopy'" \
  "bind -T copy-mode-vi C-c send -X copy-pipe-no-clear 'xsel -i --clipboard'" 

# Word navigation - bind to escape sequences for macOS compatibility
bind -T copy-mode-vi C-Left send-keys -X previous-word
bind -T copy-mode-vi C-Right send-keys -X next-word
bind -T copy-mode-vi M-b send-keys -X previous-word
bind -T copy-mode-vi M-f send-keys -X next-word
#bind -T copy-mode-vi Home send-keys 0
#bind -T copy-mode-vi End send-keys $

bind r source-file ~/.tmux.conf \; display "Reloaded configuration.."
# Update VS Code environment variables

setw -g automatic-rename on
set -g allow-rename on
set -g allow-passthrough on      # Allow escape sequences to reach outer terminal, recommended for tmux 3.3+

# Clipboard: Let tmux interface with system clipboard through terminal's OSC 52 mechanism
set -g set-clipboard on          # Whether it works depends on terminal support
# If you have tools that can send OSC 52 (like osc, tty-copy), you can also unify the copy outlet:
# set -s copy-command 'osc copy'   # or 'tty-copy'

# In VSCode, "copy on mouse select" is unnecessary; let outer VSCode handle it more naturally
set -g @yank_with_mouse off